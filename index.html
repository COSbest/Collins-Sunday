<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>FOOD TO IMAGINE</title>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span class="logo-icon">🍽</span>
            <span class="logo-text">FOOD TO IMAGINE</span>
        </div>

        <!-- NAVIGATION -->
        <nav class="nav" id="nav">

            <a href="Home.html" class="nav-link">
                Home
            </a>

            <a href="Recommended.html" class="nav-link">
                Dishes
            </a>

            <a href="Ingredients.html" class="nav-link">
                Ingredients
            </a>

        </nav>

        <!-- HAMBURGER -->
        <button
            aria-label="hamburger menu"
            class="hamburger"
            id="hamburger">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>

    <!-- HERO -->
    <section class="hero">

        <h1 class="hero-title">
            Discover & Save
            <span>Delicious Recipes</span>
        </h1>

        <p class="hero-subtitle">
            Cook smart. Eat clean. Live better.
        </p>

    </section>

    <!-- MAIN -->
    <main class="main">

        <!-- CONTROLS -->
        <div class="controls">

            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search for recipes">

            <select
                id="categoryFilter"
                class="category-select">

                <option value="all">All</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
                <option value="dessert">Dessert</option>

            </select>

            <button
                class="btn-add"
                id="openFormBtn">

                Add Recipe

            </button>

        </div>

        <!-- RECIPES -->
        <div
            class="recipe-grid"
            id="recipeGrid">

        </div>

    </main>

    <!-- MODAL -->
    <div
        class="modal-overlay"
        id="modalOverlay">

        <div class="modal">

            <button
                class="modal-close"
                id="modalClose">

                ✕

            </button>

            <h2>Add New Recipe</h2>

            <!-- RECIPE NAME -->
            <div class="form-group">

                <label for="recipeName">
                    Recipe Name
                </label>

                <input
                    type="text"
                    id="recipeName">

            </div>

            <!-- CATEGORY -->
            <div class="form-group">

                <label for="recipeCategory">
                    Category
                </label>

                <select id="recipeCategory">

                    <option value="breakfast">
                        Breakfast
                    </option>

                    <option value="lunch">
                        Lunch
                    </option>

                    <option value="dinner">
                        Dinner
                    </option>

                    <option value="snack">
                        Snack
                    </option>

                    <option value="dessert">
                        Dessert
                    </option>

                </select>

            </div>

            <!-- CUISINE -->
            <div class="form-group">

                <label for="recipeCuisine">
                    Cuisine
                </label>

                <input
                    type="text"
                    id="recipeCuisine">

            </div>

            <!-- INGREDIENTS -->
            <div class="form-group">

                <label for="recipeIngredients">
                    Ingredients (one per line)
                </label>

                <textarea
                    id="recipeIngredients"
                    rows="5"></textarea>

            </div>

            <!-- INSTRUCTIONS -->
            <div class="form-group">

                <label for="recipeInstructions">
                    Instructions
                </label>

                <textarea
                    id="recipeInstructions"
                    rows="4"></textarea>

            </div>

            <!-- EMOJI -->
            <div class="form-group">

                <label for="recipeEmoji">
                    Emoji (optional)
                </label>

                <input
                    type="text"
                    id="recipeEmoji">

            </div>

            <!-- SAVE BUTTON -->
            <button
                class="btn-submit"
                id="saveRecipeBtn">

                Save Recipe

            </button>

        </div>

    </div>

    <!-- SHOPPING PANEL -->
    <div
        class="shopping-panel"
        id="shoppingPanel">

        <h2>Shopping List</h2>

        <div id="shoppingItems"></div>

        <button
            class="btn-close-panel"
            id="closeShoppingPanel">

            Close

        </button>

    </div>

    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
